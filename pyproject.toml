[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetwise"
version = "0.1.0"
description = "BudgetWise AI - Domain-Specific Personal Budgeting Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.14.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.32.0",
    "scikit-learn>=1.4.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
